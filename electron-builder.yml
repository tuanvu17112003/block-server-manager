appId: com.blockserver.manager
productName: Block Server Manager
copyright: Block Server Manager contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: false
# Update feed. electron-updater reads this block from the packaged app and compares the running version against the
# latest GitHub release. `latest.yml` is generated into release/ by electron-builder and must be uploaded with the
# installer — without it the updater has nothing to read, and the app reports "no updates" forever.
publish:
  provider: github
  owner: tuanvu17112003
  repo: block-server-manager
  releaseType: release
win:
  # Two artefacts with different jobs:
  #   nsis     — normal installation, shortcuts, uninstall entry, data under %APPDATA%. This is the ONLY target that
  #              can self-update: the updater replaces an installed application.
  #   portable — one self-contained exe that unpacks and runs in place, keeping its data beside itself. Auto-update is
  #              disabled there by electron/services/updater.ts and the UI explains why, rather than pretending to
  #              update a file it cannot replace.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  artifactName: Block-Server-Manager-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Block Server Manager
  uninstallDisplayName: Block Server Manager
  deleteAppDataOnUninstall: false
  runAfterFinish: true
portable:
  artifactName: Block-Server-Manager-${version}-Portable.${ext}
  unpackDirName: BlockServerManager
