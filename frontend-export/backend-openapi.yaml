openapi: 3.1.0
info:
  title: Block Server Manager Backend API
  version: 1.0.0
  description: Framework-neutral RPC, event, and upload contract for the browser frontend.
servers:
  - url: /api/v1
paths:
  /rpc:
    post:
      operationId: invokeCommand
      summary: Invoke a typed backend command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcRequest'
      responses:
        '200':
          description: Command completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcSuccess'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcFailure'
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcFailure'
        '500':
          description: Backend failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcFailure'
  /events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to one existing application event topic
      parameters:
        - in: query
          name: topic
          required: true
          schema:
            type: string
          description: URL-encoded `server://log/{id}`, `server://status/{id}`, `job://progress/{jobId}`, or `curseforge://download` topic.
      responses:
        '200':
          description: Server-Sent Events stream. Each message event's data is JSON matching the subscribed topic payload.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
  /uploads/modrinth-local:
    post:
      operationId: uploadLocalMrpack
      summary: Stage a user-selected local Modrinth pack archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Staged source selection
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/LocalMrpackSelection'
        '400':
          description: Invalid or oversized archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcFailure'
  /uploads/curseforge-server-zip:
    post:
      operationId: uploadCurseForgeServerZip
      summary: Stage an author-provided CurseForge server ZIP
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Staged ZIP DTO
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
        '400':
          description: Invalid or oversized archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcFailure'
components:
  schemas:
    RpcRequest:
      type: object
      required: [command, args]
      properties:
        command:
          type: string
          description: Existing typed command name exposed by src/tauri.ts.
        args:
          type: object
          additionalProperties: true
    RpcSuccess:
      type: object
      required: [result]
      properties:
        result: {}
    RpcFailure:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    LocalMrpackSelection:
      type: object
      required: [sourceId, fileName]
      properties:
        sourceId:
          type: string
        fileName:
          type: string
