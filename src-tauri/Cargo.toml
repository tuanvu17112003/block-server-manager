[package]
name = "mc-server-manager"
version = "0.1.0"
description = "Desktop Minecraft server manager — Tauri 2 backend (Phase 0+1: foundations + SQLite servers CRUD)"
authors = ["mc-server-manager contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mc_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mc-server-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-mcp-bridge = "=0.13.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
